<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gem Cascade 3D</title>
  <meta name="description" content="Gem Cascade in 3D: the same match-3 engine rendered with Three.js, with lit gems, particles and a tilted board." />
  <link rel="stylesheet" href="../src/styles.css" />
  <link rel="stylesheet" href="styles3d.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <header>
      <div class="title">
        <h1>Gem Cascade</h1>
        <span class="badge">3D</span>
      </div>
      <span class="level-name" id="levelName">Level 1</span>
    </header>

    <section class="hud" aria-live="polite">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Target</div><div class="value" id="target">0</div></div>
      <div class="stat" id="movesStat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
    </section>

    <div class="progress" aria-hidden="true">
      <div class="fill" id="progress"></div>
      <div class="tick" style="left: 50%"></div>
      <div class="tick" style="left: 75%"></div>
    </div>

    <div class="board-wrap stage-wrap">
      <div class="stage" id="stage" role="grid" aria-label="Game board">
        <canvas id="canvas"></canvas>
        <p class="loading" id="loading">Loading 3D board...</p>
      </div>
    </div>

    <div class="controls">
      <button id="hintBtn" type="button">Hint</button>
      <button id="restartBtn" type="button">Restart</button>
      <button id="soundBtn" type="button" aria-pressed="true">Sound: On</button>
      <a class="mode-link" href="../">2D</a>
    </div>

    <p class="help">
      Swipe or tap two neighbouring gems to swap them. Match 4 for a line gem,
      an L or T shape for a bomb, and 5 in a row for a rainbow gem that clears a whole color.
    </p>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Level complete</h2>
      <div class="stars" id="modalStars"></div>
      <p id="modalText"></p>
      <div class="actions">
        <button id="retryBtn" type="button">Retry</button>
        <button id="nextBtn" type="button" class="primary">Next level</button>
      </div>
    </div>
  </div>

  <script src="../src/core.js"></script>
  <script type="module" src="game3d.js"></script>
</body>
</html>
